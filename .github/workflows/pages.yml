# Hosts https://vibe-backend.github.io/ (org root).
# Source of truth for content: vibe-backend/sdk (site/ + docs/).
# Always builds sdk@main. Deploy is never run from pull_request.
# Triggers: repository_dispatch from sdk (main only), workflow_dispatch, daily cron
# (cron is the fallback when the sdk dispatch PAT expires).
name: Pages

on:
  repository_dispatch:
    types: [deploy-docs]
  workflow_dispatch:
  schedule:
    # Daily rebuild at 00:10 Hong Kong time (16:10 UTC) — activity refresh + PAT-expiry fallback.
    - cron: '10 16 * * *'
  pull_request:
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vibe-backend/sdk (main only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vibe-backend/sdk
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build site at org root
        working-directory: site
        env:
          SITE_URL: https://vibe-backend.github.io/
          # Read-only token for development-activity (public repos only).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Check links
        working-directory: site
        run: npm run check-links
      - name: Keep /sample-shop/ free for vibe-backend/sample-shop
        run: |
          if [ -e site/dist/sample-shop ] || [ -e site/dist/sample-shop.html ]; then
            echo "Refusing to publish: org site must not claim /sample-shop/ (owned by vibe-backend/sample-shop)."
            exit 1
          fi
          echo "OK: no sample-shop path in dist."
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
